name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run --filter './extensions/*' lint:manifest
      - run: bun run zip
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-extensions
          path: extensions/*/.output/*.zip
          if-no-files-found: error
